  <script>
    // Valt tema sätts innan sidan ritas, så att den inte blinkar till i fel färg.
    (function () {
      try {
        var t = localStorage.getItem(window.KURS.kurs.kod.toLowerCase() + ".tema");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
